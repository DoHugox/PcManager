name: Build PcManager Windows Standalone EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pywin32 -r requirements.txt

    - name: Install Inno Setup Compiler
      run: choco install innosetup --no-progress

    - name: Build Standalone PcManager.exe with Custom Icon
      run: |
        pyinstaller --clean PcManager.spec

    - name: Build Windows Installer Wizard (PcManager_Setup.exe)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Verify Executables Created
      run: |
        Get-ChildItem dist/

    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PcManager-Windows-Installers
        path: |
          dist/PcManager.exe
          dist/PcManager_Setup.exe
        retention-days: 30

    - name: Create GitHub Release (Permanent Download Link)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/PcManager.exe
          dist/PcManager_Setup.exe
        name: PcManager ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
