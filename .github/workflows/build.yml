name: Build PcManager Windows Standalone EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pywin32 -r requirements.txt

    - name: Build Standalone PcManager.exe
      run: |
        pyinstaller --clean PcManager.spec

    - name: Verify PcManager.exe Exists
      run: |
        if (Test-Path "dist/PcManager.exe") {
            Write-Host "Build Succeeded! File size: $((Get-Item dist/PcManager.exe).Length / 1MB) MB"
        } else {
            Write-Error "PcManager.exe was not created!"
            exit 1
        }

    - name: Upload PcManager.exe Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PcManager-Windows-Standalone
        path: dist/PcManager.exe
        retention-days: 30
